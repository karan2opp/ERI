<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- ?v= forces browsers to drop the old cached icon -->
    <link rel="icon" href="/favicon.ico?v=3" sizes="any" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon.png?v=3" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3" />
    <!-- viewport-fit=cover lets the map run under the notch; safe-area padding keeps controls clear of it -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Earth Revival Initiative: plant today, revive tomorrow. Plant, find and care for the trees in your neighbourhood." />
    <title>Earth Revival Initiative</title>
    <!-- Link previews (WhatsApp, Facebook and others read these; they need a jpg or png) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Earth Revival Initiative" />
    <meta property="og:title" content="Earth Revival Initiative: plant today, revive tomorrow" />
    <meta property="og:description" content="Plant a tree, put it on the shared map and keep it alive with help from your neighbours. Join our plantation and clean-up drives." />
    <meta property="og:image" content="https://www.earthrevivalinitiative.in/og-home.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap"
    />
    <script>
      // Apply the saved theme before first paint so the page never flashes the wrong colours.
      // Light unless the person chose Dark ('system' is an older choice that followed the device).
      (function () {
        try {
          var saved = localStorage.getItem('plantree.theme');
          var dark = saved === 'dark' || (saved === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
